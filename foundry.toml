[profile.default]
src = "src"
test = "test"
libs = ["lib"]

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]

fuzz = { runs = 256 }

invariant = { runs = 256, depth = 500 }

[rpc_endpoints]
mainnet  = "${MAINNET_RPC_URL}"
optimism = "${OPTIMISM_RPC_URL}"
gnosis   = "${GNOSIS_RPC_URL}"
